<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIDI Smoother - Enhanced Playback</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            position: relative;
        }

        .title {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(45deg, #00f5ff, #ff00ff, #ffff00);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 245, 255, 0.3);
            margin-bottom: 1rem;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 10px rgba(0, 245, 255, 0.3)); }
            to { filter: drop-shadow(0 0 20px rgba(255, 0, 255, 0.5)); }
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.8;
            margin-bottom: 2rem;
        }

        .player-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .play-btn {
            background: linear-gradient(45deg, #00f5ff, #ff00ff);
            border: none;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 245, 255, 0.4);
        }

        .play-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 30px rgba(0, 245, 255, 0.6);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .control-label {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .slider {
            width: 120px;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            -webkit-appearance: none;
        }

        .slider::-webkit-slider-thumb {
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(45deg, #00f5ff, #ff00ff);
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(0, 245, 255, 0.5);
        }

        .progress-container {
            margin-bottom: 2rem;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00f5ff, #ff00ff, #ffff00);
            width: 0%;
            border-radius: 4px;
            transition: width 0.1s ease;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .visualizer {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 1rem;
            height: 300px;
            position: relative;
            overflow: hidden;
            margin-bottom: 2rem;
        }

        .note-track {
            position: absolute;
            height: 20px;
            background: linear-gradient(90deg, transparent, rgba(0, 245, 255, 0.6), transparent);
            border-radius: 10px;
            transform-origin: left center;
            animation: noteGlow 0.5s ease-in-out;
        }

        @keyframes noteGlow {
            0% { transform: scaleY(0); opacity: 0; }
            50% { transform: scaleY(1.2); opacity: 1; }
            100% { transform: scaleY(1); opacity: 0.8; }
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 1.5rem;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            background: linear-gradient(45deg, #00f5ff, #ff00ff);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-label {
            opacity: 0.8;
            margin-top: 0.5rem;
        }

        .advanced-controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .download-controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .download-btn {
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            border: none;
            border-radius: 25px;
            padding: 12px 24px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
        }

        @media (max-width: 768px) {
            .title {
                font-size: 2rem;
            }
            
            .controls {
                flex-wrap: wrap;
                gap: 1.5rem;
            }
            
            .control-group {
                flex-direction: row;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">MIDI Smoother</h1>
            <p class="subtitle">Enhanced Audio Playback with Real-time Visualization</p>
        </div>

        <div class="player-container">
            <div class="controls">
                <button class="play-btn" id="playBtn">▶</button>
                
                <div class="control-group">
                    <label class="control-label">Tempo</label>
                    <input type="range" class="slider" id="tempoSlider" min="0.5" max="2" step="0.1" value="1">
                    <span id="tempoValue">1.0x</span>
                </div>
                
                <div class="control-group">
                    <label class="control-label">Reverb</label>
                    <input type="range" class="slider" id="reverbSlider" min="0" max="1" step="0.1" value="0.3">
                    <span id="reverbValue">30%</span>
                </div>
                
                <div class="control-group">
                    <label class="control-label">Volume</label>
                    <input type="range" class="slider" id="volumeSlider" min="0" max="1" step="0.1" value="0.7">
                    <span id="volumeValue">70%</span>
                </div>
                
                <div class="control-group">
                    <label class="control-label">Sustain</label>
                    <input type="range" class="slider" id="sustainSlider" min="0.5" max="5" step="0.1" value="1">
                    <span id="sustainValue">1.0x</span>
                </div>
                
                <div class="control-group">
                    <label class="control-label">Smoothing</label>
                    <input type="range" class="slider" id="smoothingSlider" min="0" max="1" step="0.1" value="0.3">
                    <span id="smoothingValue">30%</span>
                </div>
            </div>

            <div class="advanced-controls">
                <div class="control-group">
                    <label class="control-label">Reverb Decay</label>
                    <input type="range" class="slider" id="reverbDecaySlider" min="0.5" max="5" step="0.1" value="2">
                    <span id="reverbDecayValue">2.0s</span>
                </div>
                
                <div class="control-group">
                    <label class="control-label">Filter Cutoff</label>
                    <input type="range" class="slider" id="filterSlider" min="200" max="8000" step="100" value="4000">
                    <span id="filterValue">4000Hz</span>
                </div>
                
                <div class="control-group">
                    <label class="control-label">Attack</label>
                    <input type="range" class="slider" id="attackSlider" min="0.001" max="0.2" step="0.01" value="0.02">
                    <span id="attackValue">20ms</span>
                </div>
                
                <div class="control-group">
                    <label class="control-label">Release</label>
                    <input type="range" class="slider" id="releaseSlider" min="0.1" max="2" step="0.1" value="0.3">
                    <span id="releaseValue">300ms</span>
                </div>
            </div>

            <div class="download-controls">
                <button class="download-btn" id="downloadMidi">Download MIDI</button>
                <button class="download-btn" id="downloadMp3">Download MP3</button>
            </div>

            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="time-display">
                    <span id="currentTime">0:00</span>
                    <span id="totalTime">0:00</span>
                </div>
            </div>

            <div class="visualizer" id="visualizer"></div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="noteCount">92</div>
                <div class="stat-label">Total Notes</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="duration">29.0s</div>
                <div class="stat-label">Duration</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="currentNote">-</div>
                <div class="stat-label">Current Note</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="playbackTime">0:00</div>
                <div class="stat-label">Playback Time</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/midi-writer-js@2.0.2/build/MidiWriter.min.js"></script>

            async initializeAudio() {
                this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                // Master gain
                this.masterGain = this.audioContext.createGain();
                this.masterGain.gain.value = 0.7;
                
                // Reverb setup
                this.reverbGain = this.audioContext.createGain();
                this.reverbGain.gain.value = 0.3;
                
                this.convolver = this.audioContext.createConvolver();
                await this.createReverbImpulse();
                
                // Connect audio graph
                this.masterGain.connect(this.audioContext.destination);
                this.reverbGain.connect(this.convolver);
                this.convolver.connect(this.masterGain);
            }

            async createReverbImpulse() {
                const length = this.audioContext.sampleRate * this.reverbDecay;
                const impulse = this.audioContext.createBuffer(2, length, this.audioContext.sampleRate);
                
                for (let channel = 0; channel < 2; channel++) {
                    const channelData = impulse.getChannelData(channel);
                    for (let i = 0; i < length; i++) {
                        const decay = Math.pow(1 - i / length, 2);
                        channelData[i] = (Math.random() * 2 - 1) * decay * 0.4;
                    }
                }
                
                this.convolver.buffer = impulse;
            }

            setupControls() {
                const playBtn = document.getElementById('playBtn');
                const tempoSlider = document.getElementById('tempoSlider');
                const reverbSlider = document.getElementById('reverbSlider');
                const volumeSlider = document.getElementById('volumeSlider');
                const sustainSlider = document.getElementById('sustainSlider');
                const smoothingSlider = document.getElementById('smoothingSlider');
                const reverbDecaySlider = document.getElementById('reverbDecaySlider');
                const filterSlider = document.getElementById('filterSlider');
                const attackSlider = document.getElementById('attackSlider');
                const releaseSlider = document.getElementById('releaseSlider');
                const downloadMidi = document.getElementById('downloadMidi');
                const downloadMp3 = document.getElementById('downloadMp3');

                playBtn.addEventListener('click', () => this.togglePlayback());
                
                tempoSlider.addEventListener('input', (e) => {
                    this.tempoMultiplier = parseFloat(e.target.value);
                    document.getElementById('tempoValue').textContent = `${this.tempoMultiplier.toFixed(1)}x`;
                });
                
                reverbSlider.addEventListener('input', (e) => {
                    const reverbAmount = parseFloat(e.target.value);
                    this.reverbGain.gain.value = reverbAmount;
                    document.getElementById('reverbValue').textContent = `${Math.round(reverbAmount * 100)}%`;
                });
                
                volumeSlider.addEventListener('input', (e) => {
                    const volume = parseFloat(e.target.value);
                    this.masterGain.gain.value = volume;
                    document.getElementById('volumeValue').textContent = `${Math.round(volume * 100)}%`;
                });

                sustainSlider.addEventListener('input', (e) => {
                    this.sustainMultiplier = parseFloat(e.target.value);
                    document.getElementById('sustainValue').textContent = `${this.sustainMultiplier.toFixed(1)}x`;
                });

                smoothingSlider.addEventListener('input', (e) => {
                    this.smoothingAmount = parseFloat(e.target.value);
                    document.getElementById('smoothingValue').textContent = `${Math.round(this.smoothingAmount * 100)}%`;
                });

                reverbDecaySlider.addEventListener('input', async (e) => {
                    this.reverbDecay = parseFloat(e.target.value);
                    document.getElementById('reverbDecayValue').textContent = `${this.reverbDecay.toFixed(1)}s`;
                    await this.createReverbImpulse();
                });

                filterSlider.addEventListener('input', (e) => {
                    this.filterCutoff = parseFloat(e.target.value);
                    document.getElementById('filterValue').textContent = `${this.filterCutoff}Hz`;
                });

                attackSlider.addEventListener('input', (e) => {
                    this.attackTime = parseFloat(e.target.value);
                    document.getElementById('attackValue').textContent = `${Math.round(this.attackTime * 1000)}ms`;
                });

                releaseSlider.addEventListener('input', (e) => {
                    this.releaseTime = parseFloat(e.target.value);
                    document.getElementById('releaseValue').textContent = `${Math.round(this.releaseTime * 1000)}ms`;
                });

                downloadMidi.addEventListener('click', () => this.downloadMIDI());
                downloadMp3.addEventListener('click', () => this.downloadMP3());
            }

            async togglePlayback() {
                if (!this.audioContext) {
                    await this.initializeAudio();
                }

                if (this.audioContext.state === 'suspended') {
                    await this.audioContext.resume();
                }

                const playBtn = document.getElementById('playBtn');
                
                if (this.isPlaying) {
                    this.stop();
                    playBtn.textContent = '▶';
                } else {
                    this.play();
                    playBtn.textContent = '⏸';
                }
            }

            play() {
                this.isPlaying = true;
                this.startTime = this.audioContext.currentTime - this.pauseTime;
                this.scheduleNotes();
                this.updateProgress();
            }

            stop() {
                this.isPlaying = false;
                this.pauseTime = this.audioContext.currentTime - this.startTime;
                
                // Stop all scheduled notes
                this.scheduledNotes.forEach(note => {
                    if (note.source) {
                        try {
                            note.source.stop();
                        } catch (e) {}
                    }
                });
                this.scheduledNotes = [];
                
                // Stop current notes
                this.currentNotes.forEach(note => {
                    try {
                        note.source.stop();
                    } catch (e) {}
                });
                this.currentNotes.clear();
            }

            scheduleNotes() {
                const currentTime = this.audioContext.currentTime;
                const lookAhead = 0.1; // 100ms lookahead
                
                this.recordingData.notes.forEach((noteData, index) => {
                    const noteStartTime = (noteData.startTimeSeconds / this.tempoMultiplier) + this.startTime;
                    const noteDuration = noteData.durationSeconds / this.tempoMultiplier;
                    
                    if (noteStartTime >= currentTime && noteStartTime <= currentTime + lookAhead) {
                        this.scheduleNote(noteData, noteStartTime, noteDuration, index);
                    }
                });

                if (this.isPlaying) {
                    requestAnimationFrame(() => this.scheduleNotes());
                }
            }

            scheduleNote(noteData, startTime, duration, index) {
                const oscillator = this.audioContext.createOscillator();
                const gainNode = this.audioContext.createGain();
                const filterNode = this.audioContext.createBiquadFilter();
                const smoothingGain = this.audioContext.createGain();
                
                // Enhanced oscillator with smoother waveform
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(noteData.frequency, startTime);
                
                // Smoothing with portamento
                if (this.smoothingAmount > 0) {
                    const smoothTime = this.smoothingAmount * 0.1;
                    oscillator.frequency.exponentialRampToValueAtTime(noteData.frequency, startTime + smoothTime);
                }
                
                // Enhanced low-pass filter
                filterNode.type = 'lowpass';
                filterNode.frequency.setValueAtTime(this.filterCutoff, startTime);
                filterNode.Q.setValueAtTime(2, startTime);
                
                // Extended ADSR envelope with sustain multiplier
                const extendedDuration = duration * this.sustainMultiplier;
                const decayTime = 0.1;
                const sustainLevel = 0.6;
                
                gainNode.gain.setValueAtTime(0, startTime);
                gainNode.gain.linearRampToValueAtTime(0.8, startTime + this.attackTime);
                gainNode.gain.linearRampToValueAtTime(sustainLevel, startTime + this.attackTime + decayTime);
                gainNode.gain.setValueAtTime(sustainLevel, startTime + extendedDuration - this.releaseTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + extendedDuration);
                
                // Smoothing gain for note transitions
                smoothingGain.gain.setValueAtTime(1, startTime);
                
                // Connect nodes
                oscillator.connect(filterNode);
                filterNode.connect(smoothingGain);
                smoothingGain.connect(gainNode);
                gainNode.connect(this.masterGain);
                gainNode.connect(this.reverbGain);
                
                oscillator.start(startTime);
                oscillator.stop(startTime + extendedDuration);
                
                // Visualization
                this.visualizeNote(noteData, startTime, extendedDuration, index);
                
                this.scheduledNotes.push({
                    source: oscillator,
                    startTime,
                    duration: extendedDuration,
                    noteData,
                    index
                });
            }

            visualizeNote(noteData, startTime, duration, index) {
                const visualizer = document.getElementById('visualizer');
                const noteTrack = document.createElement('div');
                noteTrack.className = 'note-track';
                
                const currentTime = this.audioContext.currentTime;
                const relativeStartTime = startTime - currentTime;
                
                // Position based on frequency (higher = top)
                const minFreq = 440; // A4
                const maxFreq = 1760; // A6
                const normalizedFreq = Math.max(0, Math.min(1, (noteData.frequency - minFreq) / (maxFreq - minFreq)));
                const topPosition = (1 - normalizedFreq) * 80; // 80% of container height
                
                noteTrack.style.top = `${topPosition}%`;
                noteTrack.style.left = '0%';
                noteTrack.style.width = `${(duration / (this.recordingData.recordingInfo.totalDuration / 1000)) * 100}%`;
                noteTrack.style.background = `linear-gradient(90deg, transparent, hsl(${(noteData.frequency / 10) % 360}, 70%, 60%), transparent)`;
                
                visualizer.appendChild(noteTrack);
                
                // Remove after animation
                setTimeout(() => {
                    if (noteTrack.parentNode) {
                        noteTrack.parentNode.removeChild(noteTrack);
                    }
                }, (relativeStartTime + duration + 1) * 1000);
                
                // Update current note display
                setTimeout(() => {
                    document.getElementById('currentNote').textContent = `${noteData.note}${noteData.octave}`;
                }, relativeStartTime * 1000);
            }

            updateProgress() {
                if (!this.isPlaying) return;
                
                const currentTime = this.audioContext.currentTime - this.startTime;
                const totalDuration = this.recordingData.recordingInfo.totalDuration / 1000 / this.tempoMultiplier;
                const progress = Math.min(currentTime / totalDuration, 1) * 100;
                
                document.getElementById('progressFill').style.width = `${progress}%`;
                document.getElementById('currentTime').textContent = this.formatTime(currentTime);
                document.getElementById('playbackTime').textContent = this.formatTime(currentTime);
                
                if (progress >= 100) {
                    this.stop();
                    this.pauseTime = 0;
                    document.getElementById('playBtn').textContent = '▶';
                    document.getElementById('progressFill').style.width = '0%';
                    document.getElementById('currentTime').textContent = '0:00';
                    document.getElementById('playbackTime').textContent = '0:00';
                    document.getElementById('currentNote').textContent = '-';
                } else {
                    requestAnimationFrame(() => this.updateProgress());
                }
            }

            formatTime(seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            }

            updateStats() {
                const totalDurationSeconds = this.recordingData.recordingInfo.totalDuration / 1000;
                document.getElementById('noteCount').textContent = this.recordingData.recordingInfo.totalNotes;
                document.getElementById('duration').textContent = `${totalDurationSeconds.toFixed(1)}s`;
                document.getElementById('totalTime').textContent = this.formatTime(totalDurationSeconds);
            }

            downloadMIDI() {
                const track = new MidiWriter.Track();
                
                this.recordingData.notes.forEach(noteData => {
                    const velocity = 80;
                    const ticks = Math.round((noteData.durationSeconds * this.sustainMultiplier) * 480); // 480 ticks per quarter note
                    const startTicks = Math.round(noteData.startTimeSeconds * 480);
                    
                    track.addEvent(new MidiWriter.NoteEvent({
                        pitch: [noteData.midiNote],
                        duration: ticks,
                        velocity: velocity,
                        startTick: startTicks
                    }));
                });
                
                const write = new MidiWriter.Writer(track);
                const blob = new Blob([write.buildFile()], { type: 'audio/midi' });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = 'midi-smoother-enhanced.mid';
                a.click();
                
                URL.revokeObjectURL(url);
            }

            async downloadMP3() {
                if (!this.audioContext) {
                    await this.initializeAudio();
                }

                // Create a media stream destination
                const dest = this.audioContext.createMediaStreamDestination();
                this.masterGain.connect(dest);
                
                const mediaRecorder = new MediaRecorder(dest.stream, {
                    mimeType: 'audio/webm;codecs=opus'
                });
                
                const chunks = [];
                mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
                
                mediaRecorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'audio/webm' });
                    const url = URL.createObjectURL(blob);
                    
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'midi-smoother-enhanced.webm';
                    a.click();
                    
                    URL.revokeObjectURL(url);
                    this.masterGain.disconnect(dest);
                };
                
                mediaRecorder.start();
                
                // Play the entire sequence for recording
                this.pauseTime = 0;
                this.play();
                
                // Stop recording after the full duration
                const totalDuration = (this.recordingData.recordingInfo.totalDuration / 1000 / this.tempoMultiplier) + 2;
                setTimeout(() => {
                    mediaRecorder.stop();
                    this.stop();
                    document.getElementById('playBtn').textContent = '▶';
                }, totalDuration * 1000);
            }
        }

        // Initialize the app
        const midiSmoother = new MidiSmoother();
