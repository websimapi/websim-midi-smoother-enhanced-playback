<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIDI Smoother - Enhanced Playback</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            position: relative;
        }

        .title {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(45deg, #00f5ff, #ff00ff, #ffff00);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 245, 255, 0.3);
            margin-bottom: 1rem;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 10px rgba(0, 245, 255, 0.3)); }
            to { filter: drop-shadow(0 0 20px rgba(255, 0, 255, 0.5)); }
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.8;
            margin-bottom: 2rem;
        }

        .player-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .play-btn {
            background: linear-gradient(45deg, #00f5ff, #ff00ff);
            border: none;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 245, 255, 0.4);
        }

        .play-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 30px rgba(0, 245, 255, 0.6);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .control-label {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .slider {
            width: 120px;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            -webkit-appearance: none;
        }

        .slider::-webkit-slider-thumb {
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(45deg, #00f5ff, #ff00ff);
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(0, 245, 255, 0.5);
        }

        .progress-container {
            margin-bottom: 2rem;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00f5ff, #ff00ff, #ffff00);
            width: 0%;
            border-radius: 4px;
            transition: width 0.1s ease;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .visualizer {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 1rem;
            height: 300px;
            position: relative;
            overflow: hidden;
            margin-bottom: 2rem;
        }

        .note-track {
            position: absolute;
            height: 20px;
            background: linear-gradient(90deg, transparent, rgba(0, 245, 255, 0.6), transparent);
            border-radius: 10px;
            transform-origin: left center;
            animation: noteGlow 0.5s ease-in-out;
        }

        @keyframes noteGlow {
            0% { transform: scaleY(0); opacity: 0; }
            50% { transform: scaleY(1.2); opacity: 1; }
            100% { transform: scaleY(1); opacity: 0.8; }
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 1.5rem;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            background: linear-gradient(45deg, #00f5ff, #ff00ff);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-label {
            opacity: 0.8;
            margin-top: 0.5rem;
        }

        .advanced-controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .download-controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .download-btn {
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            border: none;
            border-radius: 25px;
            padding: 12px 24px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
        }

        @media (max-width: 768px) {
            .title {
                font-size: 2rem;
            }
            
            .controls {
                flex-wrap: wrap;
                gap: 1.5rem;
            }
            
            .control-group {
                flex-direction: row;
                gap: 1rem;
            }
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">MIDI Smoother</h1>
            <p class="subtitle">Enhanced Audio Playback with Real-time Visualization</p>
        </div>

        <div class="player-container">
            <div class="controls">
                <button class="play-btn" id="playBtn">▶</button>
                
                <div class="control-group">
                    <label class="control-label">Tempo</label>
                    <input type="range" class="slider" id="tempoSlider" min="0.5" max="2" step="0.1" value="1">
                    <span id="tempoValue">1.0x</span>
                </div>
                
                <div class="control-group">
                    <label class="control-label">Reverb</label>
                    <input type="range" class="slider" id="reverbSlider" min="0" max="1" step="0.1" value="0.3">
                    <span id="reverbValue">30%</span>
                </div>
                
                <div class="control-group">
                    <label class="control-label">Volume</label>
                    <input type="range" class="slider" id="volumeSlider" min="0" max="1" step="0.1" value="0.7">
                    <span id="volumeValue">70%</span>
                </div>
                
                <div class="control-group">
                    <label class="control-label">Sustain</label>
                    <input type="range" class="slider" id="sustainSlider" min="0.5" max="5" step="0.1" value="1">
                    <span id="sustainValue">1.0x</span>
                </div>
                
                <div class="control-group">
                    <label class="control-label">Smoothing</label>
                    <input type="range" class="slider" id="smoothingSlider" min="0" max="1" step="0.1" value="0.3">
                    <span id="smoothingValue">30%</span>
                </div>
            </div>

            <div class="advanced-controls">
                <div class="control-group">
                    <label class="control-label">Reverb Decay</label>
                    <input type="range" class="slider" id="reverbDecaySlider" min="0.5" max="5" step="0.1" value="2">
                    <span id="reverbDecayValue">2.0s</span>
                </div>
                
                <div class="control-group">
                    <label class="control-label">Filter Cutoff</label>
                    <input type="range" class="slider" id="filterSlider" min="200" max="8000" step="100" value="4000">
                    <span id="filterValue">4000Hz</span>
                </div>
                
                <div class="control-group">
                    <label class="control-label">Attack</label>
                    <input type="range" class="slider" id="attackSlider" min="0.001" max="0.2" step="0.01" value="0.02">
                    <span id="attackValue">20ms</span>
                </div>
                
                <div class="control-group">
                    <label class="control-label">Release</label>
                    <input type="range" class="slider" id="releaseSlider" min="0.1" max="2" step="0.1" value="0.3">
                    <span id="releaseValue">300ms</span>
                </div>
            </div>

            <div class="download-controls">
                <input type="file" id="midiUpload" accept=".mid,.midi" style="display: none;">
                <input type="file" id="mp3Upload" accept=".mp3,.wav,.ogg" style="display: none;">
                <button class="download-btn" id="uploadMidi">Upload MIDI</button>
                <button class="download-btn" id="uploadMp3">Upload Audio</button>
                <button class="download-btn" id="downloadMidi">Download MIDI</button>
                <button class="download-btn" id="downloadMp3">Download MP3</button>
            </div>

            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="time-display">
                    <span id="currentTime">0:00</span>
                    <span id="totalTime">0:00</span>
                </div>
            </div>

            <div class="visualizer" id="visualizer"></div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="noteCount">101</div>
                <div class="stat-label">Total Notes</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="duration">16.1s</div>
                <div class="stat-label">Duration</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="currentNote">-</div>
                <div class="stat-label">Current Note</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="playbackTime">0:00</div>
                <div class="stat-label">Playback Time</div>
            </div>
        </div>
    </div>

            async initializeAudio() {
                this.audioContext = new (window.AudioContext || window.webkitAudioContext)();

                this.masterGain.gain.value = 0.7;

                this.reverbGain.gain.value = 0.3;
                
                this.convolver = this.audioContext.createConvolver();
                await this.createReverbImpulse();
                
                // Connect audio graph
                this.masterGain.connect(this.audioContext.destination);
                this.reverbGain.connect(this.convolver);
                this.convolver.connect(this.masterGain);
            }

            async createReverbImpulse() {
                const length = this.audioContext.sampleRate * this.reverbDecay;
                const impulse = this.audioContext.createBuffer(2, length, this.audioContext.sampleRate);
                
                for (let channel = 0; channel < 2; channel++) {
                    const channelData = impulse.getChannelData(channel);
                    for (let i = 0; i < length; i++) {
                        const decay = Math.pow(1 - i / length, 2);
                        channelData[i] = (Math.random() * 2 - 1) * decay * 0.4;
                    }
                }
                
                this.convolver.buffer = impulse;
            }

            async handleMidiUpload(event) {
                const file = event.target.files[0];
                if (!file) return;

                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const midiData = MidiParser.parse(new Uint8Array(arrayBuffer));
                    
                    const notes = this.convertMidiToNotes(midiData);
                    this.recordingData = {
                        recordingInfo: {
                            totalNotes: notes.length,
                            totalDuration: Math.max(...notes.map(n => n.startTime + n.duration)),
                            timestamp: new Date().toISOString()
                        },
                        notes: notes
                    };
                    
                    this.updateStats();
                    this.stop(); // Reset playback
                    document.getElementById('playBtn').textContent = '▶';
                    
                    // Show success message
                    this.showNotification('MIDI file loaded successfully!');
                } catch (error) {
                    console.error('Error parsing MIDI file:', error);
                    this.showNotification('Error loading MIDI file. Please try another file.');
                }
            }

            async handleAudioUpload(event) {
                const file = event.target.files[0];
                if (!file) return;

                try {
                    if (!this.audioContext) {
                        await this.initializeAudio();
                    }

                    const arrayBuffer = await file.arrayBuffer();
                    const audioBuffer = await this.audioContext.decodeAudioData(arrayBuffer);
                    
                    // Simple audio analysis - extract dominant frequencies over time
                    const notes = await this.analyzeAudioBuffer(audioBuffer);
                    
                    this.recordingData = {
                        recordingInfo: {
                            totalNotes: notes.length,
                            totalDuration: audioBuffer.duration * 1000,
                            timestamp: new Date().toISOString()
                        },
                        notes: notes
                    };
                    
                    this.updateStats();
                    this.stop();
                    document.getElementById('playBtn').textContent = '▶';
                    
                    this.showNotification('Audio file analyzed and loaded!');
                } catch (error) {
                    console.error('Error processing audio file:', error);
                    this.showNotification('Error loading audio file. Please try another file.');
                }
            }

            convertMidiToNotes(midiData) {
                const notes = [];
                const ticksPerSecond = (midiData.timeDivision * 120) / 60; // Assuming 120 BPM
                
                midiData.track.forEach(track => {
                    let currentTime = 0;
                    
                    track.event.forEach(event => {
                        currentTime += event.deltaTime / ticksPerSecond;
                        
                        if (event.type === 9 && event.data[1] > 0) { // Note on
                            const midiNote = event.data[0];
                            const velocity = event.data[1];
                            const frequency = 440 * Math.pow(2, (midiNote - 69) / 12);
                            
                            // Find corresponding note off
                            let duration = 0.5; // Default duration
                            let searchTime = currentTime;
                            
                            for (let i = track.event.indexOf(event) + 1; i < track.event.length; i++) {
                                const nextEvent = track.event[i];
                                searchTime += nextEvent.deltaTime / ticksPerSecond;
                                
                                if ((nextEvent.type === 8 || (nextEvent.type === 9 && nextEvent.data[1] === 0)) 
                                    && nextEvent.data[0] === midiNote) {
                                    duration = searchTime - currentTime;
                                    break;
                                }
                            }
                            
                            const noteNames = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
                            const octave = Math.floor(midiNote / 12) - 1;
                            const noteName = noteNames[midiNote % 12];
                            
                            notes.push({
                                note: noteName,
                                octave: octave,
                                frequency: frequency,
                                midiNote: midiNote,
                                startTime: Math.round(currentTime * 1000),
                                duration: Math.round(duration * 1000),
                                startTimeSeconds: currentTime,
                                durationSeconds: duration
                            });
                        }
                    });
                });
                
                return notes.sort((a, b) => a.startTime - b.startTime);
            }

            async analyzeAudioBuffer(audioBuffer) {
                // Simple frequency analysis - this is a basic implementation
                const notes = [];
                const sampleRate = audioBuffer.sampleRate;
                const channelData = audioBuffer.getChannelData(0);
                const windowSize = 2048;
                const overlap = windowSize / 2;
                
                for (let i = 0; i < channelData.length - windowSize; i += overlap) {
                    const window = channelData.slice(i, i + windowSize);
                    const frequency = this.findDominantFrequency(window, sampleRate);
                    
                    if (frequency > 80 && frequency < 2000) { // Musical range
                        const startTime = i / sampleRate;
                        const midiNote = Math.round(12 * Math.log2(frequency / 440) + 69);
                        const noteNames = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
                        const octave = Math.floor(midiNote / 12) - 1;
                        const noteName = noteNames[midiNote % 12];
                        
                        notes.push({
                            note: noteName,
                            octave: octave,
                            frequency: frequency,
                            midiNote: midiNote,
                            startTime: Math.round(startTime * 1000),
                            duration: Math.round((overlap / sampleRate) * 1000),
                            startTimeSeconds: startTime,
                            durationSeconds: overlap / sampleRate
                        });
                    }
                }
                
                return this.consolidateNotes(notes);
            }

            findDominantFrequency(samples, sampleRate) {
                // Simple autocorrelation-based pitch detection
                const correlations = [];
                const minPeriod = Math.floor(sampleRate / 800); // 800 Hz max
                const maxPeriod = Math.floor(sampleRate / 80);  // 80 Hz min
                
                for (let period = minPeriod; period < maxPeriod; period++) {
                    let correlation = 0;
                    for (let i = 0; i < samples.length - period; i++) {
                        correlation += samples[i] * samples[i + period];
                    }
                    correlations.push({period, correlation});
                }
                
                const maxCorrelation = correlations.reduce((max, curr) => 
                    curr.correlation > max.correlation ? curr : max, correlations[0]);
                
                return sampleRate / maxCorrelation.period;
            }

            consolidateNotes(notes) {
                // Merge similar consecutive notes
                const consolidated = [];
                let currentNote = null;
                
                notes.forEach(note => {
                    if (!currentNote || 
                        Math.abs(currentNote.frequency - note.frequency) > 10 ||
                        note.startTime - (currentNote.startTime + currentNote.duration) > 100) {
                        if (currentNote) consolidated.push(currentNote);
                        currentNote = { ...note };
                    } else {
                        // Extend current note
                        currentNote.duration = note.startTime + note.duration - currentNote.startTime;
                        currentNote.durationSeconds = currentNote.duration / 1000;
                    }
                });
                
                if (currentNote) consolidated.push(currentNote);
                return consolidated;
            }

                oscillator.connect(filterNode);
                filterNode.connect(smoothingGain);
                smoothingGain.connect(gainNode);
                gainNode.connect(this.masterGain);
                gainNode.connect(this.reverbGain);
                
                oscillator.start(startTime);
                oscillator.stop(startTime + extendedDuration);
                
                // Visualization
                this.visualizeNote(noteData, startTime, extendedDuration, index);
                
                this.scheduledNotes.push({
                    source: oscillator,
                    startTime,
                    duration: extendedDuration,
                    noteData,
                    index
                });
            }

            visualizeNote(noteData, startTime, duration, index) {
                const visualizer = document.getElementById('visualizer');
                const noteTrack = document.createElement('div');
                noteTrack.className = 'note-track';
                
                const currentTime = this.audioContext.currentTime;
                const relativeStartTime = startTime - currentTime;
                
                // Position based on frequency (higher = top)
                const minFreq = 440; // A4
                const maxFreq = 1760; // A6
                const normalizedFreq = Math.max(0, Math.min(1, (noteData.frequency - minFreq) / (maxFreq - minFreq)));
                const topPosition = (1 - normalizedFreq) * 80; // 80% of container height
                
                noteTrack.style.top = `${topPosition}%`;
                noteTrack.style.left = '0%';
                noteTrack.style.width = `${(duration / (this.recordingData.recordingInfo.totalDuration / 1000)) * 100}%`;
                noteTrack.style.background = `linear-gradient(90deg, transparent, hsl(${(noteData.frequency / 10) % 360}, 70%, 60%), transparent)`;
                
                visualizer.appendChild(noteTrack);
                
                // Remove after animation
                setTimeout(() => {
                    if (noteTrack.parentNode) {
                        noteTrack.parentNode.removeChild(noteTrack);
                    }
                }, (relativeStartTime + duration + 1) * 1000);
                
                // Update current note display
                setTimeout(() => {
                    document.getElementById('currentNote').textContent = `${noteData.note}${noteData.octave}`;
                }, relativeStartTime * 1000);
            }

            updateProgress() {
                if (!this.isPlaying) return;
                
                const currentTime = this.audioContext.currentTime - this.startTime;
                const totalDuration = this.recordingData.recordingInfo.totalDuration / 1000 / this.tempoMultiplier;
                const progress = Math.min(currentTime / totalDuration, 1) * 100;
                
                document.getElementById('progressFill').style.width = `${progress}%`;
                document.getElementById('currentTime').textContent = this.formatTime(currentTime);
                document.getElementById('playbackTime').textContent = this.formatTime(currentTime);
                
                if (progress >= 100) {
                    this.stop();
                    this.pauseTime = 0;
                    document.getElementById('playBtn').textContent = '▶';
                    document.getElementById('progressFill').style.width = '0%';
                    document.getElementById('currentTime').textContent = '0:00';
                    document.getElementById('playbackTime').textContent = '0:00';
                    document.getElementById('currentNote').textContent = '-';
                } else {
                    requestAnimationFrame(() => this.updateProgress());
                }
            }

            formatTime(seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            }

            updateStats() {
                const totalDurationSeconds = this.recordingData.recordingInfo.totalDuration / 1000;
                document.getElementById('noteCount').textContent = this.recordingData.recordingInfo.totalNotes;
                document.getElementById('duration').textContent = `${totalDurationSeconds.toFixed(1)}s`;
                document.getElementById('totalTime').textContent = this.formatTime(totalDurationSeconds);
            }

            downloadMIDI() {
                try {
                    const tracks = [];
                    const track = new MidiWriter.Track();
                    
                    // Set tempo
                    track.addEvent(new MidiWriter.MetaEvent({
                        type: 'setTempo',
                        data: [500000] // 120 BPM (500000 microseconds per quarter note)
                    }));
                    
                    // Sort notes by start time
                    const sortedNotes = [...this.recordingData.notes].sort((a, b) => a.startTime - b.startTime);
                    
                    sortedNotes.forEach((noteData, index) => {
                        const velocity = 80;
                        const durationTicks = Math.max(1, Math.round((noteData.durationSeconds * this.sustainMultiplier) * 480));
                        const waitTicks = index === 0 ? 0 : Math.round((noteData.startTimeSeconds - sortedNotes[index - 1].startTimeSeconds) * 480);
                        
                        if (waitTicks > 0) {
                            track.addEvent(new MidiWriter.NoteEvent({
                                pitch: [noteData.midiNote],
                                duration: 'T0', // No duration for the wait
                                velocity: 0,
                                tick: waitTicks
                            }));
                        }
                        
                        track.addEvent(new MidiWriter.NoteEvent({
                            pitch: [noteData.midiNote],
                            duration: `T${durationTicks}`,
                            velocity: velocity
                        }));
                    });
                    
                    tracks.push(track);
                    const write = new MidiWriter.Writer(tracks);
                    const midiData = write.buildFile();
                    
                    const blob = new Blob([midiData], { type: 'audio/midi' });
                    const url = URL.createObjectURL(blob);
                    
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `midi-smoother-enhanced-${Date.now()}.mid`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    
                    URL.revokeObjectURL(url);
                    this.showNotification('MIDI file downloaded successfully!');
                } catch (error) {
                    console.error('Error creating MIDI file:', error);
                    this.showNotification('Error creating MIDI file. Please try again.');
                }
            }

            async downloadMP3() {
                if (!this.audioContext) {
                    await this.initializeAudio();
                }

                // Create a media stream destination
                const dest = this.audioContext.createMediaStreamDestination();
                this.masterGain.connect(dest);
                
                const mediaRecorder = new MediaRecorder(dest.stream, {
                    mimeType: 'audio/webm;codecs=opus'
                });
                
                const chunks = [];
                mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
                
                mediaRecorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'audio/webm' });
                    const url = URL.createObjectURL(blob);
                    
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'midi-smoother-enhanced.webm';
                    a.click();
                    
                    URL.revokeObjectURL(url);
                    this.masterGain.disconnect(dest);
                };
                
                mediaRecorder.start();
                
                // Play the entire sequence for recording
                this.pauseTime = 0;
                this.play();
                
                // Stop recording after the full duration
                const totalDuration = (this.recordingData.recordingInfo.totalDuration / 1000 / this.tempoMultiplier) + 2;
                setTimeout(() => {
                    mediaRecorder.stop();
                    this.stop();
                    document.getElementById('playBtn').textContent = '▶';
                }, totalDuration * 1000);
            }

            showNotification(message) {
                // Create a simple notification
                const notification = document.createElement('div');
                notification.textContent = message;
                notification.style.cssText = `
                    position: fixed; top: 20px; right: 20px; z-index: 1000;
                    background: linear-gradient(45deg, #00f5ff, #ff00ff);
                    color: white; padding: 1rem 2rem; border-radius: 10px;
                    box-shadow: 0 4px 20px rgba(0, 245, 255, 0.4);
                    animation: slideIn 0.3s ease;
                `;
                
                document.body.appendChild(notification);
                setTimeout(() => {
                    notification.style.animation = 'slideOut 0.3s ease forwards';
                    setTimeout(() => notification.remove(), 300);
                }, 3000);
            }
        }

        // Initialize the app
        const midiSmoother = new MidiSmoother();
    </script>
